[package]
name = "herowallpaper"
version = "0.1.6"
edition = "2021"
description = "A lightweight wallpaper for Wayland: images and animated images, scaled and crossfaded by the compositor"
license = "MIT"
repository = "https://github.com/HeroineOS/HeroWallpaper"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp", "avif-native", "bmp", "qoi", "tiff"] }
jpeg-decoder = { version = "0.3", default-features = false }
fast_image_resize = "5"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = { version = "0.23", default-features = false, features = ["parse", "display"] }
serde = { version = "1", features = ["derive"] }
png = "0.18"
md5 = "0.7"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
maintainer = "HeroineOS <https://github.com/HeroineOS>"
copyright = "HeroineOS contributors"
section = "x11"
priority = "optional"
depends = "$auto"
# Videos play through the ffmpeg command.
recommends = "ffmpeg, libgbm1"
extended-description = """\
A lightweight wallpaper for Wayland compositors with wlr-layer-shell \
(HeroWM, sway, Hyprland, KDE...): still and animated pictures (JPEG, PNG/APNG, \
GIF, WebP, AVIF, BMP, TIFF, QOI) and looping videos (through ffmpeg), crossfades, a picture per screen. Scaling \
and fading are left to the compositor, so it idles at well under a megabyte \
of its own memory. Configured in ~/.config/hero/wallpaper.toml, or with \
`herowallpaper set PICTURE`."""
assets = [
    ["target/release/herowallpaper", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/herowallpaper/README.md", "644"],
    ["res/wallpaper.toml", "usr/share/doc/herowallpaper/examples/wallpaper.toml", "644"],
]
